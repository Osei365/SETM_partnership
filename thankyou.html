<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <link rel="icon" type="image/png" href="logo.jpeg">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .thankyou-container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .icon {
            font-size: 50px;
            color: #28a745;
            margin-bottom: 15px;
        }
        h1 {
            color: #333333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #666666;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .back-btn {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }
        .back-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="thankyou-container">
        <div class="icon">✓</div>
        <h1>Submission Received!</h1>
        <p>Thank you for reaching out. Your details have been successfully recorded in our system.</p>
        <a href="index.html" class="back-btn">Return Home</a>
    </div>
</body>
</html>
